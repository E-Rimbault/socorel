<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Produits</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #005a8b, #0073ae);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            background: #0073ae;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #005a8b;
        }

        .product-list {
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fff;
            color: #333;
            padding: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .product-item {
            padding: 10px;
            margin: 5px 0;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .product-item:hover {
            background: #f1f1f1;
        }
    </style>
</head>

<body>
    <form id="productForm">
        <h1>Gestion des Produits</h1>

        <label for="familySelect">Filtrer par Famille :</label>
        <select id="familySelect">
            <option value="">-- Sélectionnez une Famille --</option>
        </select>

        <label for="existingProducts">Produits existants :</label>
        <div class="product-list" id="productList"></div>

        <label for="famille">Famille du Produit :</label>
        <input type="text" name="famille" id="famille" placeholder="Famille du produit" required>

        <label for="nom_produit">Nom du Produit :</label>
        <input type="text" name="nom_produit" id="nom_produit" placeholder="Nom du produit" required>

        <!-- Ajoutez ce champ sous le champ 'Nom du Produit' -->
        <label for="quantity">Quantité à Ajouter :</label>
        <input type="number" name="quantity" id="quantity" placeholder="Nombre de produits" min="1" required>


        <button type="submit">Ajouter le Produit</button>
    </form>

    <script>
        const productList = document.getElementById('productList');
        const familySelect = document.getElementById('familySelect');
        const nomProduitInput = document.getElementById('nom_produit');
        const familleInput = document.getElementById('famille');

        const products = [
            { id: 1, name: "FP8-RS/24V", family: "FP8" },
            { id: 2, name: "FP8-RS/230V", family: "FP8" },
            { id: 3, name: "FP8-IP/24V", family: "FP8" },
            { id: 4, name: "FP8-IP/230V", family: "FP8" },
            { id: 5, name: "Téléinfo-RS/24V", family: "Téléinfo" },
            { id: 6, name: "Téléinfo-RS/230V", family: "Téléinfo" },
            { id: 7, name: "Téléinfo-IP/24V", family: "Téléinfo" },
            { id: 8, name: "Téléinfo-IP/230V", family: "Téléinfo" },
            { id: 9, name: "Sonde T+H", family: "sonde" },
            { id: 10, name: "Sonde T,H,CO²", family: "sonde" },
            { id: 11, name: "Tic Light", family: "Tic Light" },
            { id: 12, name: "Flexy", family: "Flexy" },
            { id: 13, name: "RTIC", family: "Rtic" },
        ];

        const uniqueFamilies = [...new Set(products.map(product => product.family))];

        function displayFamilies() {
            uniqueFamilies.forEach(family => {
                const option = document.createElement('option');
                option.value = family;
                option.textContent = family;
                familySelect.appendChild(option);
            });
        }

        function displayProducts(filterFamily = "") {
            productList.innerHTML = "";
            const filteredProducts = products.filter(product => product.family === filterFamily);

            if (filteredProducts.length === 0) {
                productList.innerHTML = "<p>Aucun produit disponible</p>";
            } else {
                filteredProducts.forEach(product => {
                    const productItem = document.createElement('div');
                    productItem.classList.add('product-item');
                    productItem.textContent = `${product.name} - ${product.family}`;
                    productItem.dataset.name = product.name;
                    productItem.dataset.family = product.family;
                    productItem.addEventListener('click', () => selectProduct(product));
                    productList.appendChild(productItem);
                });
            }
        }

        function selectProduct(product) {
            nomProduitInput.value = product.name;
            familleInput.value = product.family;
        }

        familySelect.addEventListener('change', () => {
            const selectedFamily = familySelect.value;
            displayProducts(selectedFamily);
        });

        displayFamilies();

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            fetch('process.php', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error); // Affiche une pop-up en cas d'erreur
                    } else if (data.success) {
                        alert(data.success); // Affiche une pop-up en cas de succès
                    }
                })
                .catch(error => {
                    alert("Une erreur est survenue : " + error.message);
                });
        });
    </script>
</body>

</html>
